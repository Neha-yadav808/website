<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #2563eb;
            font-size: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .box h2 {
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            background: #64748b;
            margin-left: 8px;
        }

        .search {
            display: flex;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f8fafc;
        }

        .edit {
            background: #16a34a;
            padding: 7px 12px;
            border-radius: 5px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .delete {
            background: #dc2626;
            padding: 7px 12px;
            border-radius: 5px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .message {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 700px) {
            .cards {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Student Management System</h1>
    <p>Manage Student Records Easily</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="cards">

        <div class="card">
            <h2 id="totalStudents">0</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2>📚</h2>
            <p>Student Records</p>
        </div>

        <div class="card">
            <h2>✅</h2>
            <p>Management System</p>
        </div>

    </div>

    <div id="message" class="message"></div>

    <!-- Add Student -->
    <div class="box">

        <h2 id="formTitle">➕ Add New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <input type="text"
                       id="name"
                       placeholder="Student Name"
                       required>

                <input type="text"
                       id="roll"
                       placeholder="Roll Number"
                       required>

                <input type="email"
                       id="email"
                       placeholder="Email">

                <input type="text"
                       id="phone"
                       placeholder="Phone Number">

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="BBA">BBA</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="MCA">MCA</option>
                </select>

                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>
                </select>

            </div>

            <br>

            <button type="submit" id="submitBtn">
                Add Student
            </button>

            <button type="button"
                    class="cancel"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                    style="display:none;">
                Cancel
            </button>

        </form>

    </div>


    <!-- Search -->
    <div class="box">

        <h2>🔍 Search Student</h2>

        <div class="search">

            <input type="text"
                   id="search"
                   placeholder="Search by name, roll number or course"
                   onkeyup="displayStudents()">

            <button onclick="clearSearch()">
                Clear
            </button>

        </div>

    </div>


    <!-- Student List -->
    <div class="box">

        <h2>📋 Student List</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>


<script>

    // Student data
    let students = JSON.parse(localStorage.getItem("students")) || [];

    let editIndex = -1;


    // Form submit
    document.getElementById("studentForm").addEventListener("submit", function(e) {

        e.preventDefault();

        let student = {

            name: document.getElementById("name").value,
            roll: document.getElementById("roll").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            course: document.getElementById("course").value,
            semester: document.getElementById("semester").value

        };


        // Edit student
        if (editIndex !== -1) {

            students[editIndex] = student;

            showMessage("Student updated successfully!");

            editIndex = -1;

            document.getElementById("formTitle").innerText =
                "➕ Add New Student";

            document.getElementById("submitBtn").innerText =
                "Add Student";

            document.getElementById("cancelBtn").style.display =
                "none";

        }

        // Add student
        else {

            students.push(student);

            showMessage("Student added successfully!");

        }


        saveData();

        this.reset();

        displayStudents();

    });


    // Display students
    function displayStudents() {

        let table = document.getElementById("studentTable");

        let search = document
            .getElementById("search")
            .value
            .toLowerCase();

        table.innerHTML = "";

        let filteredStudents = students.filter(function(student) {

            return (
                student.name.toLowerCase().includes(search) ||
                student.roll.toLowerCase().includes(search) ||
                student.course.toLowerCase().includes(search)
            );

        });


        filteredStudents.forEach(function(student) {

            let originalIndex = students.indexOf(student);

            table.innerHTML += `

                <tr>

                    <td>${originalIndex + 1}</td>

                    <td>${student.name}</td>

                    <td>${student.roll}</td>

                    <td>${student.email}</td>

                    <td>${student.phone}</td>

                    <td>${student.course}</td>

                    <td>${student.semester}</td>

                    <td>

                        <button class="edit"
                                onclick="editStudent(${originalIndex})">
                            Edit
                        </button>

                        <button class="delete"
                                onclick="deleteStudent(${originalIndex})">
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        });


        document.getElementById("totalStudents").innerText =
            students.length;

    }


    // Edit student
    function editStudent(index) {

        let student = students[index];

        document.getElementById("name").value =
            student.name;

        document.getElementById("roll").value =
            student.roll;

        document.getElementById("email").value =
            student.email;

        document.getElementById("phone").value =
            student.phone;

        document.getElementById("course").value =
            student.course;

        document.getElementById("semester").value =
            student.semester;


        editIndex = index;

        document.getElementById("formTitle").innerText =
            "✏️ Edit Student";

        document.getElementById("submitBtn").innerText =
            "Update Student";

        document.getElementById("cancelBtn").style.display =
            "inline-block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // Delete student
    function deleteStudent(index) {

        if (confirm("Are you sure you want to delete this student?")) {

            students.splice(index, 1);

            saveData();

            displayStudents();

            showMessage("Student deleted successfully!");

        }

    }


    // Save data
    function saveData() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

    }


    // Cancel edit
    function cancelEdit() {

        editIndex = -1;

        document.getElementById("studentForm").reset();

        document.getElementById("formTitle").innerText =
            "➕ Add New Student";

        document.getElementById("submitBtn").innerText =
            "Add Student";

        document.getElementById("cancelBtn").style.display =
            "none";

    }


    // Clear search
    function clearSearch() {

        document.getElementById("search").value = "";

        displayStudents();

    }


    // Message
    function showMessage(text) {

        let message = document.getElementById("message");

        message.innerText = text;

        message.style.display = "block";

        setTimeout(function() {

            message.style.display = "none";

        }, 2500);

    }


    // Load students when page opens
    displayStudents();

</script>

</body>
</html>
